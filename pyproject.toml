[project]
name = "vna_app"
version = "0.1.0"
requires-python = ">=3.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = ["flowgraphs"]  # générés par GNU Radio Companion

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
